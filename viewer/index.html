<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reachy Mini Viewer</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1c2633; font-family: system-ui, sans-serif; }
    #status {
      position: fixed; top: 12px; left: 12px; padding: 8px 12px; border-radius: 8px;
      background: rgba(0, 0, 0, 0.55); color: #fff; font-size: 13px; line-height: 1.5; white-space: pre;
    }
    #status .ok { color: #7ee787; }
    #status .ng { color: #ff7b72; }

    /* マイク・スピーカー・カメラ（media.js） */
    #media {
      position: fixed; left: 12px; bottom: 12px; padding: 10px; border-radius: 10px; max-width: calc(100vw - 48px);
      background: rgba(0, 0, 0, 0.55); color: #fff; font-size: 13px; display: grid; gap: 8px;
    }
    #media[hidden] { display: none; }
    #media .buttons { display: flex; gap: 6px; flex-wrap: wrap; }
    #media button {
      font: inherit; color: #fff; background: #2d3b4d; border: 1px solid #4a5d75; border-radius: 6px;
      padding: 6px 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    }
    #media button:disabled { opacity: 0.4; cursor: not-allowed; }
    #media button::after { content: "オフ"; font-size: 11px; color: #9fb0c4; }
    #media button[data-state="pending"]::after { content: "接続中"; color: #f2cc60; }
    #media button[data-state="on"] { background: #1f4d33; border-color: #3fb950; }
    #media button[data-state="on"]::after { content: "オン"; color: #7ee787; }
    #mic-level {
      --level: 0; position: relative; height: 4px; border-radius: 2px; background: #2d3b4d; overflow: hidden;
    }
    #mic-level::before {
      content: ""; position: absolute; inset: 0; background: #3fb950;
      transform-origin: left; transform: scaleX(var(--level)); transition: transform 60ms linear;
    }
    #camera-preview { display: none; width: 240px; max-width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 6px; background: #000; }
    #media.with-video #camera-preview { display: block; }
    #media-note { color: #ff7b72; max-width: 320px; }
    #media-note:empty { display: none; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
        "mujoco": "https://cdn.jsdelivr.net/npm/@mujoco/mujoco@3.17.0/mujoco.js"
      }
    }
  </script>
</head>
<body>
  <div id="status">読み込み中...</div>
  <div id="media">
    <video id="camera-preview" muted playsinline></video>
    <div class="buttons">
      <button id="mic-toggle" type="button" title="ブラウザのマイクを、ロボットのマイクとして使う">🎤 マイク</button>
      <button id="speaker-toggle" type="button" title="ロボットのスピーカーの音を、このブラウザで鳴らす">🔊 スピーカー</button>
      <button id="camera-toggle" type="button" title="ブラウザのカメラを、ロボットのカメラとして使う">📷 カメラ</button>
    </div>
    <div id="mic-level" aria-hidden="true"></div>
    <div id="media-note" role="status"></div>
  </div>
  <script type="module" src="/static/main.js"></script>
  <script type="module" src="/static/media.js"></script>
</body>
</html>
